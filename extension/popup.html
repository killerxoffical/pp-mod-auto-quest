<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      box-sizing: border-box;
    }
    h3 {
      font-size: 15px;
      margin: 0 0 6px 0;
      color: #00a854;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 11.5px;
      color: #94a3b8;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #00a854; color: #fff; margin-bottom: 8px; }
    .btn-secondary { background: #3b82f6; color: #fff; margin-bottom: 8px; }
    .btn-outline { background: #1e293b; color: #38bdf8; border: 1px solid #334155; }
    .token-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 10px;
      word-break: break-all;
      font-family: monospace;
      font-size: 11px;
      color: #38bdf8;
      max-height: 80px;
      overflow-y: auto;
    }
    .status {
      font-size: 11px;
      color: #fbbf24;
      margin-bottom: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h3>🔑 PlayQuest Token Finder</h3>
  <p>গুগল প্লে গেমস আনলকারের জন্য আপনার অফিসিয়াল সেশন টোকেন বের করুন।</p>

  <button id="btnOpenGoogle" class="btn btn-primary">🌐 গুগল লগইন পেজ খুলুন</button>

  <div id="statusText" class="status">টোকেন খোঁজা হচ্ছে...</div>

  <div id="tokenSection" style="display: none;">
    <div style="font-size: 11px; font-weight: 700; margin-bottom: 4px; color: #00a854;">✅ আপনার টোকেন রেডি:</div>
    <div id="tokenVal" class="token-box"></div>
    <button id="btnCopy" class="btn btn-secondary">📋 টোকেন কপি করুন</button>
    <button id="btnOpenWeb" class="btn btn-outline">🚀 প্লেকুয়েস্টে সরাসরি লগইন করুন</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
